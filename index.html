<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark only" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="رهگیر مطالعه" />
  <meta name="application-name" content="رهگیر مطالعه کنکور" />
  <title>رهگیر مطالعه کنکور</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png" />
  <link rel="icon" href="icon-512.png" sizes="512x512" type="image/png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css?v=26.35" />
  <script>
    // PWA: register SW early; if not controlling yet, reload once so Install becomes available
    (function () {
      if (!("serviceWorker" in navigator)) return;
      navigator.serviceWorker.register("./sw.js", { scope: "./", updateViaCache: "none" })
        .then(function (reg) {
          if (reg.waiting) reg.waiting.postMessage({ type: "SKIP_WAITING" });
          reg.update();
          return navigator.serviceWorker.ready;
        })
        .then(function () {
          if (!navigator.serviceWorker.controller && !sessionStorage.getItem("rahgir_sw_reload")) {
            sessionStorage.setItem("rahgir_sw_reload", "1");
            location.reload();
          }
        })
        .catch(function (e) { console.warn("SW", e); });
    })();
  </script>
</head>
<body>
  <div id="app" class="app"><p>در حال بارگذاری…</p></div>
  <script>
    setTimeout(function () {
      var a = document.getElementById("app");
      if (a && /بارگذاری/.test(a.textContent || "")) {
        a.innerHTML = "<p style=\"color:#fff;padding:16px\">اگر صفحه گیر کرد: تنظیمات سایت → پاک کردن داده، بعد دوباره باز کن.</p>";
      }
    }, 12000);
  </script>
  <div id="mini" class="mini-timer"></div>
  <nav class="dock" id="dock">
    <div class="dock-island">
      <div class="dock-inner">
        <button type="button" data-nav="manage">مدیریت</button>
        <button type="button" data-nav="history">تاریخچه</button>
        <button type="button" data-nav="stats">آمار</button>
        <button type="button" data-nav="exam">آزمون</button>
        <button type="button" data-nav="share">اشتراک</button>
      </div>
    </div>
  </nav>
  <div id="overlay" class="overlay"><div class="sheet" id="sheet"></div></div>
  <div id="focus" class="focus"></div>
  <article id="print" class="print-only"></article>
  <script type="module" src="app.js?v=26.35"></script>
</body>
</html>
